name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      # NOTE: `npm run typecheck:core` is intentionally advisory for now —
      # the fork currently carries ~309 pre-existing tsc errors (inherited from
      # upstream code). Next.js build ignores these via next.config.mjs
      # (typescript.ignoreBuildErrors). Do not make this blocking until the
      # baseline is burned down.
      - run: npm run typecheck:core
        continue-on-error: true
